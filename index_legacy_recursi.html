<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ValuationOfAccudraw</title>
  <script src="/Library/UITools.js"></script>
  <script src="js/ValuationOfAccudraw.js"></script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0d1117; color: #c9d1d9; font-family: monospace; overflow: hidden; }
    #app-container { width: 100vw; height: 100vh; box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="app-container"></div>
  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        if (typeof ValuationOfAccudraw !== 'undefined') {
          const app = new ValuationOfAccudraw();
          await app.run({ container: document.getElementById('app-container') });
          console.log('[Luno App] ValuationOfAccudraw running.');
        } else {
          document.body.innerHTML = '<div style="padding:1.5rem; color:#f85149;">⚠️ ValuationOfAccudraw class undefined.</div>';
        }
      } catch (err) {
        document.body.innerHTML = '<div style="padding:1.5rem; color:#f85149;">⚠️ App Init Error: ' + (err.stack || err.message) + '</div>';
      }
    });
  </script>
</body>
</html>
